<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade Prática 3 - Formulário e Canvas</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #2c3e50; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input[type="text"], input[type="email"], input[type="date"], input[type="tel"] {
    width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
  }
  input[type="range"] { width: 100%; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #3498db; color: #fff; border: none; border-radius: 4px; }
  button:hover { background: #2980b9; }
  canvas { border: 1px solid #333; margin-top: 20px; display: block; }
  #valorSatisfacao { font-weight: bold; }
</style>
</head>
<body>
  <h1>Formulário Aprimorado com Canvas</h1>

  <form id="formCadastro">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="nascimento">Data de nascimento:</label>
    <input type="date" id="nascimento" name="nascimento" required>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

    <label for="satisfacao">Nível de satisfação: <span id="valorSatisfacao">50</span></label>
    <input type="range" id="satisfacao" name="satisfacao" min="0" max="100" value="50">

    <button type="submit">Enviar</button>
  </form>

  <canvas id="grafico" width="400" height="60"></canvas>

  <script>
    const range = document.getElementById('satisfacao');
    const valorSpan = document.getElementById('valorSatisfacao');
    const form = document.getElementById('formCadastro');
    const canvas = document.getElementById('grafico');
    const ctx = canvas.getContext('2d');

    range.addEventListener('input', () => {
      valorSpan.textContent = range.value;
    });

    function desenharBarra(valor) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fundo da barra
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(0, 15, canvas.width, 30);

      // Barra proporcional ao valor (0-100)
      const larguraBarra = (valor / 100) * canvas.width;
      ctx.fillStyle = '#3498db';
      ctx.fillRect(0, 15, larguraBarra, 30);

      // Texto
      ctx.fillStyle = '#000';
      ctx.font = '14px Arial';
      ctx.fillText('Satisfação: ' + valor + '%', 10, 55);
    }

    form.addEventListener('submit', function (evento) {
      evento.preventDefault();
      desenharBarra(Number(range.value));
    });
  </script>
</body>
</html>
